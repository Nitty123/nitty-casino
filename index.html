<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NITTY — Private Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08080a;
      color: #e8e4d9;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 600;
      color: #c9a84c;
      letter-spacing: 10px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .subtitle {
      font-size: 12px;
      color: #5a5650;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 8px;
      text-align: center;
    }
    .cards {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    a.card {
      text-decoration: none;
      width: 260px;
      padding: 40px 32px;
      border-radius: 20px;
      border: 1px solid #2a2a38;
      background: #131318;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    a.card:hover {
      border-color: #c9a84c;
      transform: translateY(-8px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.1);
    }
    a.card.bank { border-color: #3a3020; }
    a.card.casino { border-color: #1e3020; }
    .card-icon { font-size: 36px; }
    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      color: #c9a84c;
      letter-spacing: 4px;
    }
    .card-desc { font-size: 13px; color: #5a5650; line-height: 1.6; }
    .card-arrow { font-size: 18px; color: #c9a84c; margin-top: 10px; }
    footer {
      font-size: 11px;
      color: #3a3830;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div>
    <div class="title">NITTY</div>
    <div class="subtitle">Private Suite</div>
  </div>
  <div class="cards">
    <a class="card bank" href="bank.html">
      <div class="card-icon">🏦</div>
      <div class="card-name">VAULT</div>
      <div class="card-desc">Private Banking · Manage your balance, card, and transfers</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card casino" href="casino.html">
      <div class="card-icon">🎰</div>
      <div class="card-name">NEXUS</div>
      <div class="card-desc">Casino · Blackjack private table with live chip action</div>
      <div class="card-arrow">→</div>
    </a>
  </div>
  <footer>© 2025 NITTY PRIVATE SUITE</footer>
</body>
</html>
