<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claude Chat</title>
  <script src="https://js.puter.com/v2/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #161618;
      --border: #2a2a2e;
      --accent: #d4a853;
      --accent-dim: rgba(212,168,83,0.12);
      --text: #e8e4dc;
      --muted: #6b6760;
      --user-bg: #1e1c1a;
      --ai-bg: #131312;
      --radius: 14px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: 18px;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    header h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .model-badge {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted);
    }

    .empty-state .big-letter {
      font-family: 'Fraunces', serif;
      font-size: 80px;
      font-weight: 300;
      font-style: italic;
      color: var(--border);
      line-height: 1;
    }

    .empty-state p {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .message-row {
      display: flex;
      padding: 10px 28px;
      gap: 14px;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }

    .avatar.user-av {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(212,168,83,0.25);
    }

    .avatar.ai-av {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      font-family: 'Fraunces', serif;
      font-style: italic;
    }

    .bubble {
      max-width: min(600px, 72%);
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 13.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .ai .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: #d0ccc4;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }

    .typing-indicator span {
      width: 5px; height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    footer {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: rgba(212,168,83,0.45);
      box-shadow: 0 0 0 3px rgba(212,168,83,0.07);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      max-height: 160px;
      overflow-y: auto;
    }

    textarea::placeholder { color: var(--muted); }

    textarea::-webkit-scrollbar { width: 3px; }
    textarea::-webkit-scrollbar-thumb { background: var(--border); }

    #send-btn {
      width: 34px; height: 34px;
      flex-shrink: 0;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
      color: #0e0e0f;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; }

    .hint {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Claude <span>Chat</span></h1>
  <span class="model-badge">claude-opus-4.7-fast</span>
</header>

<div id="messages">
  <div class="empty-state" id="empty">
    <div class="big-letter">C</div>
    <p>Ask anything</p>
  </div>
</div>

<footer>
  <div class="input-wrap">
    <textarea id="prompt" rows="1" placeholder="Type a message…"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const promptEl   = document.getElementById('prompt');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');

  // Auto-resize textarea
  promptEl.addEventListener('input', () => {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function appendMessage(role, text) {
    emptyEl?.remove();

    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user-av' : 'ai-av'}`;
    avatar.textContent = role === 'user' ? 'U' : 'C';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    emptyEl?.remove();
    const row = document.createElement('div');
    row.className = 'message-row ai';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai-av';
    avatar.textContent = 'C';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  async function sendMessage() {
    const text = promptEl.value.trim();
    if (!text) return;

    appendMessage('user', text);
    promptEl.value = '';
    promptEl.style.height = 'auto';
    sendBtn.disabled = true;

    const typingRow = showTyping();

    try {
      const response = await puter.ai.chat(text, { model: 'claude-opus-4.7-fast' });
      typingRow.remove();

      // Extract text from response
      let reply = '';
      if (typeof response === 'string') {
        reply = response;
      } else if (response?.message?.content) {
        const content = response.message.content;
        if (Array.isArray(content)) {
          reply = content.map(b => b.text || '').join('');
        } else {
          reply = content;
        }
      } else if (response?.text) {
        reply = response.text;
      } else {
        reply = JSON.stringify(response);
      }

      appendMessage('ai', reply);
    } catch (err) {
      typingRow.remove();
      appendMessage('ai', '⚠ Error: ' + (err.message || 'Something went wrong.'));
    } finally {
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  promptEl.focus();
</script>
</body>
</html>
