<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // Ваша конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyC25opJgTxCJacH1r2gS9iaqfYHjGzADus",
    authDomain: "nitty-casino.firebaseapp.com",
    projectId: "nitty-casino",
    storageBucket: "nitty-casino.firebasestorage.app",
    messagingSenderId: "609501277778",
    appId: "1:609501277778:web:56871266b5a9a39cf7798b",
    measurementId: "G-XP8ZLV0GR1"
  };

  // Инициализация Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_USERS = ['admin', 'owner', 'Nitty'];
  let currentUser = null;

  // Функция для получения всех пользователей (теперь из Firebase)
  function getUsers(callback) {
    db.ref('vaultUsers').once('value', (snapshot) => {
      callback(snapshot.val() || {});
    });
  }

  // Функция сохранения (теперь в Firebase)
  function saveUsers(users, callback) {
    db.ref('vaultUsers').set(users, () => {
      if (callback) callback();
    });
  }

  // --- Реальное время: следим за базой данных ---
  db.ref('vaultUsers').on('value', (snapshot) => {
    const users = snapshot.val() || {};
    adminRefreshUsers(); // Обновляем список админа при любых изменениях
    
    if (currentUser && users[currentUser]) {
      updateUI(users[currentUser]);
    }
  });

  function switchTab(tab) {
    document.getElementById('tabLogin').style.background = tab === 'login' ? '#c9a84c' : 'transparent';
    document.getElementById('tabLogin').style.color = tab === 'login' ? '#0c0c0e' : '#7a7870';
    document.getElementById('tabRegister').style.background = tab === 'register' ? '#c9a84c' : 'transparent';
    document.getElementById('tabRegister').style.color = tab === 'register' ? '#0c0c0e' : '#7a7870';
    document.getElementById('auth-title').textContent = tab === 'login' ? 'LOGIN' : 'CREATE ACCOUNT';
    document.getElementById('auth-btn').textContent = tab === 'login' ? 'ACCESS VAULT' : 'REGISTER ACCOUNT';
  }

  function handleAuth() {
    const user = document.getElementById('auth-username').value.trim();
    const pin = document.getElementById('auth-pin').value.trim();
    const errorEl = document.getElementById('auth-error');

    if (!user || !pin) {
      errorEl.textContent = "Please fill in all fields.";
      return;
    }

    const isRegistering = document.getElementById('auth-btn').textContent.includes('REGISTER');

    getUsers((users) => {
      if (isRegistering) {
        if (users[user]) {
          errorEl.textContent = "Account nickname already exists.";
          return;
        }
        const newUser = {
          pin: pin,
          balance: 1000.00,
          accountNumber: "VLT-" + Math.floor(100000 + Math.random() * 900000),
          cvv: Math.floor(100 + Math.random() * 900),
          expiry: "12/31",
          history: [{desc: "Account Activated", amt: 1000.00, type: "pos", date: new Date().toLocaleString()}]
        };
        users[user] = newUser;
        saveUsers(users, () => {
          loginAs(user, newUser);
        });
      } else {
        if (users[user] && users[user].pin === pin) {
          loginAs(user, users[user]);
        } else {
          errorEl.textContent = "Invalid account reference or security PIN.";
        }
      }
    });
  }

  function loginAs(username, data) {
    currentUser = username;
    localStorage.setItem('vaultRemember', username);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('user-tag').textContent = username.toUpperCase();
    
    if (ADMIN_USERS.includes(username)) {
      document.getElementById('adminBadge').style.display = 'inline-block';
      document.getElementById('adminPanelContainer').style.display = 'block';
    } else {
      document.getElementById('adminBadge').style.display = 'none';
      document.getElementById('adminPanelContainer').style.display = 'none';
    }
    updateUI(data);
    showToast(`Welcome back, ${username}`);
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('vaultRemember');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('auth-username').value = '';
    document.getElementById('auth-pin').value = '';
    document.getElementById('auth-error').textContent = '';
  }

  function updateUI(data) {
    document.getElementById('displayBalance').textContent = parseFloat(data.balance).toLocaleString('en-US', {minimumFractionDigits: 2});
    document.getElementById('cardNum').textContent = data.accountNumber.replace(/(.{4})/g, '$1 ');
    document.getElementById('cardHolder').textContent = currentUser.toUpperCase();
    document.getElementById('cardExp').textContent = data.expiry;
    document.getElementById('cardCvv').textContent = data.cvv;

    const txList = document.getElementById('txList');
    if (!data.history || data.history.length === 0) {
      txList.innerHTML = '<div class="tx-item"><div class="tx-desc">No transaction records found.</div></div>';
      return;
    }
    
    txList.innerHTML = data.history.map(tx => `
      <div class="tx-item">
        <div class="tx-left">
          <div class="tx-icon" style="background:${tx.type === 'pos' ? 'rgba(39,174,96,0.1)' : 'rgba(192,57,43,0.1)'}; color:${tx.type === 'pos' ? 'var(--green)' : 'var(--red)'}">
            ${tx.type === 'pos' ? '↓' : '↑'}
          </div>
          <div>
            <div class="tx-desc">${tx.desc}</div>
            <div class="tx-date">${tx.date}</div>
          </div>
        </div>
        <div class="tx-amount ${tx.type}">${tx.type === 'pos' ? '+' : '-'}$${parseFloat(Math.abs(tx.amt)).toFixed(2)}</div>
      </div>
    `).join('');
  }

  function handleWireTransfer() {
    const target = document.getElementById('wire-target').value.trim();
    const amount = parseFloat(document.getElementById('wire-amount').value);

    if (!target || !amount || amount <= 0) {
      showToast("Please provide valid transfer references.");
      return;
    }
    if (target === currentUser) {
      showToast("Cannot wire credits to yourself.");
      return;
    }

    getUsers((users) => {
      if (!users[target]) {
        showToast("Target client registry not found.");
        return;
      }

      const myData = users[currentUser];
      if (myData.balance < amount) {
        showToast("Insufficient vault limits available.");
        return;
      }

      const timeString = new Date().toLocaleString();
      
      myData.history = myData.history || [];
      myData.history.unshift({ desc: `Wire to ${target}`, amt: amount, type: "neg", date: timeString });
      myData.balance -= amount;
      
      const targetData = users[target];
      targetData.history = targetData.history || [];
      targetHistory = targetData.history;
      targetHistory.unshift({ desc: `Wire from ${currentUser}`, amt: amount, type: "pos", date: timeString });
      targetData.balance += amount;

      saveUsers(users, () => {
        showToast(`Successfully wired $${amount.toFixed(2)} to ${target}`);
        document.getElementById('wire-target').value = '';
        document.getElementById('wire-amount').value = '';
      });
    });
  }

  // --- Админ-панель банка ---
  function adminAdjustBalance() {
    const username = document.getElementById('admin-target-user').value.trim();
    const amount = parseFloat(document.getElementById('admin-amount-adjust').value);

    if (!username || isNaN(amount)) {
      showToast("Invalid admin command credentials.");
      return;
    }

    getUsers((users) => {
      if (!users[username]) {
        showToast("Target client entry not found.");
        return;
      }

      users[username].balance = (parseFloat(users[username].balance) || 0) + amount;
      users[username].history = users[username].history || [];
      users[username].history.unshift({
        desc: "System Admin Adjustment",
        amt: Math.abs(amount),
        type: amount >= 0 ? "pos" : "neg",
        date: new Date().toLocaleString()
      });

      saveUsers(users, () => {
        showToast(`Adjusted balance for ${username} by $${amount.toFixed(2)}`);
        document.getElementById('admin-target-user').value = '';
        document.getElementById('admin-amount-adjust').value = '';
      });
    });
  }

  function adminDeleteUser() {
    const username = document.getElementById('admin-target-user').value.trim();
    if (!username) {
      showToast("Target client entry not found.");
      return;
    }
    if (username === currentUser) {
      showToast("Cannot delete your own supervisor terminal.");
      return;
    }

    if (!confirm(`Permanently erase ${username} from database?`)) return;

    getUsers((users) => {
      if (!users[username]) {
        showToast("Target client entry not found.");
        return;
      }
      delete users[username];
      saveUsers(users, () => {
        showToast(`Client account "${username}" erased.`);
        document.getElementById('admin-target-user').value = '';
      });
    });
  }

  function adminRefreshUsers() {
    const el = document.getElementById('adminUserList');
    if (!el) return;
    
    getUsers((users) => {
      const list = Object.keys(users);
      if (!list.length) { el.textContent = 'No records active'; return; }
      
      el.innerHTML = list.map(u => {
        const bal = parseFloat(users[u].balance || 0).toLocaleString('en-US', {minimumFractionDigits:2});
        const isAdm = ADMIN_USERS.includes(u) ? ' 👑' : '';
        return `
          <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,56,0.4);">
            <span style="color:var(--text)">${u}${isAdm}</span>
            <span style="color:var(--gold)">$${bal}</span>
          </div>`;
      }).join('');
    });
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
  }
  
  function showToast(msg) {
    const t = document.getElementById('toast');
    if (t) {
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }
  }

  // Проверка сохраненной сессии при загрузке
  const remembered = localStorage.getItem('vaultRemember');
  if (remembered) {
    setTimeout(() => {
      getUsers((users) => {
        if (users[remembered]) {
          loginAs(remembered, users[remembered]);
        }
      });
    }, 1000);
  }
</script>
